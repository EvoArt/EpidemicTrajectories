StatsFuns = "4c63d2b9-4356-54db-8cca-17b64c39e42c"

# The residual CHECKS and PLOTS are weak deps, so neither HypothesisTests nor
# Makie (nor their dependency trees) enters the core. A user who only wants
# residual values loads neither; `using HypothesisTests` enables the uniformity
# tests and `using CairoMakie` the plots. See src/diagnostics.jl.
[weakdeps]
HypothesisTests = "09f84164-cd44-5f33-b23f-e6b0d136a0d5"
Makie = "ee78f7c6-11fb-53f2-987a-cfe4a2b5a57a"

[extensions]
EpidemicTrajectoriesHypothesisTestsExt = "HypothesisTests"
EpidemicTrajectoriesMakieExt = "Makie"

[compat]
Distributions = "0.25"
HypothesisTests = "0.10, 0.11"
Makie = "0.20, 0.21, 0.22, 0.23, 0.24"
StatsFuns = "1"
julia = "1.10"

[extras]
ForwardDiff = "f6369f11-7733-5829-9624-2563aa707210"
HypothesisTests = "09f84164-cd44-5f33-b23f-e6b0d136a0d5"
Logging = "56ddb016-857b-54e1-b83d-db4d58db5568"
StableRNGs = "860ef19b-820b-49d6-a774-d7a799459cd3"
Statistics = "10745b16-79ce-11e8-11f9-7d13ad32a3b2"
